<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>别上当 · 反诈情景游戏</title>
<style>
  html, body { margin: 0; height: 100%; background: #161313; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  canvas { display: block; image-rendering: pixelated; touch-action: none; user-select: none; -webkit-user-select: none; }
  @media (pointer: fine) { canvas { cursor: none; } }
  #rotate { display: none; position: fixed; inset: 0; z-index: 3; background: rgba(22,19,19,0.94); color: #e89c74; font-size: 16px; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 10px; padding: 24px; }
  #rotate small { color: #968f87; font-size: 13px; }
  @media (orientation: portrait) and (max-width: 700px) { #rotate.show { display: flex; } }
</style>
</head>
<body>
<canvas id="game" width="640" height="360"></canvas>
<div id="rotate" class="show">
  <div>把手机横过来玩</div>
  <small>竖屏也能玩，但字会很小</small>
  <button type="button" onclick="this.parentNode.classList.remove('show')" style="margin-top:8px;padding:6px 14px">先竖着玩</button>
</div>
<script>
'use strict';

// ============================================================
// 基础
// ============================================================
const W = 640, H = 360;
const canvasEl = document.getElementById('game');
const ctx = canvasEl.getContext('2d');
ctx.imageSmoothingEnabled = false;

let now = 0;

const C = {
  INK: '#161313', PAPER: '#e4dfd4', PAPER_D: '#c8c0b0',
  GREY: '#968f87', GREY_D: '#5c5650', GREY_L: '#b8b0a4',
  RED: '#b42e28', RED_D: '#78201c', RED_L: '#de5c4c',
  GREEN: '#548046', GREEN_D: '#385830', GREEN_L: '#7ab262',
  BLUE: '#3c5a78', BLUE_L: '#5c7e9e',
  ORANGE: '#dc9646', CLAUDE: '#cc7050', CLAUDE_L: '#e89c74',
  DESK: '#443932', DESK_D: '#382f2a', DESK_L: '#54483f',
  SKY: '#2a3440', NIGHT: '#1a2230', CHAT_BG: '#1e1c1c',
  BUBBLE_ME: '#95ec69', BUBBLE_OTHER: '#ffffff',
  WHITE: '#e4dfd4', BLACK: '#161313', GOLD: '#bea064',
  SKIN: '#d8a888', SKIN_D: '#b88868', HAIR: '#2a2420', HAIR_L: '#3a322c',
  SHIRT: '#4a5a6a', SHIRT_L: '#5a6a7a', PANTS: '#2a2a30',
  WOOD: '#6a5244', WALL: '#3a3430', FLOOR: '#2a2420',
  PHONE: '#1a1a1e', PHONE_L: '#2a2a30', PHONE_SCREEN: '#95ec69',
  DOC: '#e8e0d0', DOC_D: '#c8c0b0', STAMP_RED: '#b42e28', STAMP_GREEN: '#548046',
};

function setFont(size, bold = false) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px "Courier New", monospace`;
  ctx.textBaseline = 'top';
}
function txt(x, y, s, size = 12, col = C.WHITE, align = 'left') {
  setFont(size); ctx.fillStyle = col; ctx.textAlign = align;
  ctx.fillText(String(s), Math.round(x), Math.round(y));
}
function txtW(s, size = 12) { setFont(size); return ctx.measureText(String(s)).width; }
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function outline(x, y, w, h, col, lw = 1) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.round(w) - 1, Math.round(h) - 1); }
function inBox(x, y, b) { return x >= b[0] && y >= b[1] && x <= b[0] + b[2] && y <= b[1] + b[3]; }
function wrap(s, size, width) {
  const lines = []; let cur = '';
  for (const ch of String(s)) {
    if (ch === '\n') { lines.push(cur); cur = ''; continue; }
    if (cur && txtW(cur + ch, size) > width) { lines.push(cur); cur = ch; } else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}
function roundRect(x, y, w, h, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill();
}

// ============================================================
// 人物绘制（呼吸 / 眨眼 / 摆臂 / 说话 / 手机微光）
// ============================================================
function drawPerson(x, y, scale, expr, opts = {}) {
  const s = scale;
  const seed = opts.seed || 0;
  const T = now;
  const still = !!opts.still;

  // —— 待机动画 ——
  const idle      = still ? 0 : Math.sin(T * 1.7 + seed * 2.3) * 1.2 * s;
  const armSwing  = still ? 0 : Math.sin(T * 1.7 + seed * 2.3 + 1.4) * 1.0 * s;
  const headBob   = still ? 0 : Math.sin(T * 1.7 + seed * 2.3 + 0.5) * 0.6 * s;

  // —— 眨眼 ——
  const blinkPhase = (((T * 0.7 + seed * 0.37) % 1) + 1) % 1;
  const blinking = !still && blinkPhase > 0.96 && expr !== 'shock';

  // —— 说话 ——
  const talking = opts.talk && Math.sin(T * 15 + seed * 3) > -0.25;

  const skin = opts.skin || C.SKIN;
  const hair = opts.hair || C.HAIR;
  const shirt = opts.shirt || C.SHIRT;
  const pants = opts.pants || C.PANTS;
  const shirtL = opts.shirtL || C.SHIRT_L;
  const hairL = opts.hairL || C.HAIR_L;
  const isFem = opts.female;

  // 影子（不随呼吸浮动）
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(x, y + 1 * s, 16 * s, 4 * s, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(0, idle);

  const legH = 18 * s, bodyH = 22 * s, headR = 11 * s;
  const bodyY = y - legH - bodyH;
  const headY = bodyY - headR * 2 + 2 * s + headBob;

  // 腿
  rect(x - 7 * s, y - legH, 5 * s, legH, pants);
  rect(x + 2 * s, y - legH, 5 * s, legH, pants);
  // 鞋
  rect(x - 8 * s, y - 3 * s, 7 * s, 3 * s, '#1a1a1e');
  rect(x + 1 * s, y - 3 * s, 7 * s, 3 * s, '#1a1a1e');

  // 身体（梯形肩膀）
  ctx.fillStyle = shirt;
  ctx.beginPath();
  ctx.moveTo(x - 12 * s, bodyY + bodyH);
  ctx.lineTo(x - 14 * s, bodyY + 6 * s);
  ctx.lineTo(x - 8 * s, bodyY);
  ctx.lineTo(x + 8 * s, bodyY);
  ctx.lineTo(x + 14 * s, bodyY + 6 * s);
  ctx.lineTo(x + 12 * s, bodyY + bodyH);
  ctx.closePath(); ctx.fill();
  // 衣领
  rect(x - 3 * s, bodyY, 6 * s, 4 * s, shirtL);

  // 手臂（呼吸摆臂）
  rect(x - 16 * s, bodyY + 6 * s + armSwing, 4 * s, 14 * s, shirt);
  rect(x + 12 * s, bodyY + 6 * s + armSwing, 4 * s, 14 * s, shirt);
  // 手
  rect(x - 16 * s, bodyY + 20 * s + armSwing, 4 * s, 4 * s, skin);
  rect(x + 12 * s, bodyY + 20 * s + armSwing, 4 * s, 4 * s, skin);

  // 头
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.arc(x, headY + headR, headR, 0, Math.PI * 2);
  ctx.fill();

  // 头发
  ctx.fillStyle = hair;
  if (isFem) {
    ctx.beginPath();
    ctx.arc(x, headY + headR, headR + 1 * s, Math.PI, Math.PI * 2);
    ctx.lineTo(x + headR + 1 * s, headY + headR + 10 * s);
    ctx.lineTo(x + headR - 3 * s, headY + headR + 10 * s);
    ctx.lineTo(x + headR - 3 * s, headY + headR + 2 * s);
    ctx.lineTo(x - headR + 3 * s, headY + headR + 2 * s);
    ctx.lineTo(x - headR + 3 * s, headY + headR + 10 * s);
    ctx.lineTo(x - headR - 1 * s, headY + headR + 10 * s);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(x, headY + headR, headR + 1 * s, Math.PI, Math.PI * 2);
    ctx.lineTo(x + headR + 1 * s, headY + headR + 2 * s);
    ctx.lineTo(x + headR - 2 * s, headY + headR - 1 * s);
    ctx.lineTo(x - headR + 2 * s, headY + headR - 1 * s);
    ctx.lineTo(x - headR - 1 * s, headY + headR + 2 * s);
    ctx.closePath(); ctx.fill();
  }
  // 头发高光
  rect(x - 4 * s, headY + 2 * s, 3 * s, 1 * s, hairL);

  // 五官
  const eyeY = headY + headR + 1 * s;
  const eyeDX = 4 * s;
  const eyeSize = 1.5 * s;
  const eyeH = blinking ? 0.6 * s : eyeSize;

  if (expr === 'angry') {
    rect(x - eyeDX - 3 * s, eyeY - 3 * s, 5 * s, 1 * s, C.INK);
    rect(x + eyeDX - 2 * s, eyeY - 3 * s, 5 * s, 1 * s, C.INK);
    rect(x - eyeDX, eyeY, eyeSize, eyeH, C.INK);
    rect(x + eyeDX, eyeY, eyeSize, eyeH, C.INK);
  } else if (expr === 'shock') {
    rect(x - eyeDX - 1 * s, eyeY - 1 * s, 3 * s, 3 * s, C.WHITE);
    rect(x - eyeDX, eyeY, eyeSize, eyeSize, C.INK);
    rect(x + eyeDX - 1 * s, eyeY - 1 * s, 3 * s, 3 * s, C.WHITE);
    rect(x + eyeDX, eyeY, eyeSize, eyeSize, C.INK);
  } else if (expr === 'sad') {
    rect(x - eyeDX, eyeY + 1 * s, eyeSize, eyeH, C.INK);
    rect(x + eyeDX, eyeY + 1 * s, eyeSize, eyeH, C.INK);
    rect(x - eyeDX - 3 * s, eyeY - 2 * s, 4 * s, 1 * s, C.INK);
    rect(x + eyeDX, eyeY - 2 * s, 4 * s, 1 * s, C.INK);
  } else if (expr === 'fake') {
    rect(x - eyeDX - 1 * s, eyeY, 3 * s, 1 * s, C.INK);
    rect(x + eyeDX - 1 * s, eyeY, 3 * s, 1 * s, C.INK);
  } else if (expr === 'nervous') {
    rect(x - eyeDX + 1 * s, eyeY, eyeSize, eyeH, C.INK);
    rect(x + eyeDX + 1 * s, eyeY, eyeSize, eyeH, C.INK);
  } else {
    rect(x - eyeDX, eyeY, eyeSize, eyeH, C.INK);
    rect(x + eyeDX, eyeY, eyeSize, eyeH, C.INK);
  }

  // 嘴（说话时开合）
  const mouthY = eyeY + 5 * s;
  if (talking) {
    const mh = (1.2 + Math.abs(Math.sin(T * 14 + seed)) * 2.2) * s;
    rect(x - 2.5 * s, mouthY, 5 * s, mh, C.INK);
  } else if (expr === 'fake') {
    rect(x - 3 * s, mouthY, 6 * s, 1 * s, C.INK);
    rect(x - 4 * s, mouthY - 1 * s, 1 * s, 1 * s, C.INK);
    rect(x + 3 * s, mouthY - 1 * s, 1 * s, 1 * s, C.INK);
  } else if (expr === 'shock') {
    rect(x - 2 * s, mouthY, 4 * s, 3 * s, C.INK);
  } else if (expr === 'angry') {
    rect(x - 3 * s, mouthY + 1 * s, 6 * s, 1 * s, C.INK);
  } else if (expr === 'sad') {
    rect(x - 3 * s, mouthY + 1 * s, 6 * s, 1 * s, C.INK);
    rect(x - 4 * s, mouthY + 2 * s, 1 * s, 1 * s, C.INK);
    rect(x + 3 * s, mouthY + 2 * s, 1 * s, 1 * s, C.INK);
  } else {
    rect(x - 2 * s, mouthY, 4 * s, 1 * s, C.INK);
  }

  // 汗滴（会慢慢滑落）
  if (expr === 'nervous') {
    const drop = still ? 0 : ((T * 0.5 + seed) % 1) * 4 * s;
    ctx.fillStyle = '#9cbacc';
    ctx.beginPath();
    ctx.arc(x + headR - 2 * s, headY + headR - 4 * s + drop, 1.5 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  // 眼镜
  if (opts.glasses) {
    outline(x - eyeDX - 3 * s, eyeY - 2 * s, 6 * s, 5 * s, C.INK, 1);
    outline(x + eyeDX - 3 * s, eyeY - 2 * s, 6 * s, 5 * s, C.INK, 1);
    rect(x - 1 * s, eyeY, 2 * s, 1 * s, C.INK);
  }

  // 道具：手机（屏幕有呼吸微光）
  if (opts.phone) {
    const glow = 0.16 + (Math.sin(T * 2.4 + seed) + 1) * 0.09;
    ctx.fillStyle = `rgba(149,236,105,${glow.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(x + 17 * s, bodyY + 23 * s, 13 * s, 0, Math.PI * 2);
    ctx.fill();
    rect(x + 14 * s, bodyY + 18 * s, 6 * s, 10 * s, C.PHONE);
    rect(x + 15 * s, bodyY + 19 * s, 4 * s, 7 * s, C.PHONE_SCREEN);
  }
  // 道具：文件夹
  if (opts.folder) {
    rect(x - 22 * s, bodyY + 16 * s, 8 * s, 11 * s, C.DOC);
    outline(x - 22 * s, bodyY + 16 * s, 8 * s, 11 * s, C.DOC_D);
  }

  ctx.restore();
}

// ============================================================
// 场景绘制
// ============================================================
function drawScene(stage) {
  const t = stage || 'room';
  if (t === 'room') drawRoom();
  else if (t === 'chat') drawChatBg();
  else if (t === 'transfer') drawTransferBg();
  else if (t === 'group') drawGroupBg();
  else if (t === 'web') drawWebBg();
  else if (t === 'office') drawOfficeBg();
  else if (t === 'rent') drawRentBg();
  else if (t === 'night') drawNightBg();
}

function drawRoom() {
  rect(0, 0, W, H, C.WALL);
  rect(0, 220, W, H - 220, C.FLOOR);
  for (let i = 0; i < 8; i++) rect(0, 220 + i * 18, W, 1, '#221e1a');
  // 桌子
  rect(180, 200, 280, 8, C.WOOD);
  rect(190, 208, 8, 60, C.WOOD);
  rect(442, 208, 8, 60, C.WOOD);
  // 台灯（灯光轻微呼吸）
  rect(400, 150, 4, 50, '#4a4440');
  rect(380, 140, 44, 10, '#5a5048');
  const lampA = 0.13 + Math.sin(now * 2.2) * 0.035;
  ctx.fillStyle = `rgba(255,220,150,${lampA.toFixed(3)})`;
  ctx.beginPath(); ctx.arc(402, 150, 80, 0, Math.PI * 2); ctx.fill();
  // 床
  rect(20, 210, 120, 50, '#3a3448');
  rect(20, 200, 120, 12, '#4a4458');
  rect(30, 196, 30, 8, '#5a5468');
  // 海报（AI 字微微闪烁）
  rect(60, 40, 60, 80, '#2a3448');
  outline(60, 40, 60, 80, '#1a2438');
  const blink = Math.sin(now * 1.6) > 0.9;
  txt(90, 70, 'AI', 24, blink ? '#ffb08a' : C.CLAUDE_L, 'center');
  // 窗外
  rect(480, 40, 100, 80, C.NIGHT);
  outline(480, 40, 100, 80, '#2a2a30', 2);
  rect(530, 40, 2, 80, '#2a2a30');
  rect(480, 78, 100, 2, '#2a2a30');
  ctx.fillStyle = '#e8e0c8'; ctx.beginPath(); ctx.arc(540, 58, 8, 0, Math.PI * 2); ctx.fill();
}

function drawChatBg() {
  rect(0, 0, W, H, C.CHAT_BG);
  rect(0, 0, W, 36, '#2a2826');
  rect(0, 35, W, 1, '#3a3632');
}

function drawTransferBg() {
  rect(0, 0, W, H, '#1a1c20');
  rect(160, 20, 320, 320, '#0e1014');
  outline(160, 20, 320, 320, '#2a2c30', 2);
  rect(200, 40, 240, 30, '#1a1c20');
  txt(320, 48, '转账', 16, C.WHITE, 'center');
  rect(200, 100, 240, 60, '#1a1c20');
  txt(210, 108, '收款人', 11, C.GREY);
  txt(210, 126, '林浩', 16, C.WHITE);
  rect(200, 180, 240, 60, '#1a1c20');
  txt(210, 188, '金额', 11, C.GREY);
  txt(210, 206, '¥3000.00', 20, C.RED_L);
  // 确认按钮呼吸
  const pulse = 0.75 + Math.sin(now * 3) * 0.25;
  ctx.globalAlpha = pulse;
  rect(200, 280, 240, 36, C.RED);
  ctx.globalAlpha = 1;
  txt(320, 288, '确认转账', 14, C.WHITE, 'center');
}

function drawGroupBg() {
  rect(0, 0, W, H, C.CHAT_BG);
  rect(0, 0, W, 36, '#2a2826');
  txt(16, 8, '校园兼职群 (487)', 14, C.WHITE);
  for (let i = 0; i < 6; i++) {
    const x = 20 + (i % 3) * 100, y = 50 + Math.floor(i / 3) * 100;
    rect(x, y, 80, 80, '#2a2826');
    outline(x, y, 80, 80, '#3a3632');
    txt(x + 40, y + 30, '👤', 24, C.GREY, 'center');
  }
}

function drawWebBg() {
  rect(0, 0, W, H, '#1a1c20');
  rect(0, 0, W, 30, '#2a2c30');
  rect(10, 6, 200, 18, '#1a1c20');
  outline(10, 6, 200, 18, '#3a3c40');
  txt(16, 8, 'https://xx-danbao.xyz/...', 10, C.GREY);
  rect(100, 50, 440, 280, '#22242a');
  txt(320, 70, 'XX 担保交易平台', 18, C.WHITE, 'center');
  txt(320, 100, '资金托管 · 安全可靠', 11, C.GREY, 'center');
  rect(160, 130, 320, 30, '#1a1c20'); outline(160, 130, 320, 30, '#3a3c40');
  txt(170, 138, '手机号', 11, C.GREY);
  rect(160, 170, 320, 30, '#1a1c20'); outline(160, 170, 320, 30, '#3a3c40');
  txt(170, 178, '身份证号', 11, C.GREY);
  rect(160, 210, 320, 30, '#1a1c20'); outline(160, 210, 320, 30, '#3a3c40');
  txt(170, 218, '银行卡号', 11, C.GREY);
  rect(160, 250, 320, 30, '#1a1c20'); outline(160, 250, 320, 30, '#3a3c40');
  txt(170, 258, '短信验证码', 11, C.GREY);
  const pulse = 0.75 + Math.sin(now * 3) * 0.25;
  ctx.globalAlpha = pulse;
  rect(160, 290, 320, 28, C.RED);
  ctx.globalAlpha = 1;
  txt(320, 296, '提交验证', 13, C.WHITE, 'center');
}

function drawOfficeBg() {
  rect(0, 0, W, H, '#2a2e34');
  rect(100, 220, 440, 20, C.WOOD);
  rect(120, 240, 20, 80, C.WOOD); rect(500, 240, 20, 80, C.WOOD);
  rect(0, 0, W, 120, '#3a3e44');
  rect(420, 30, 160, 100, '#e8e4d8');
  outline(420, 30, 160, 100, '#c8c4b8', 2);
  txt(500, 50, '内推', 16, C.INK, 'center');
  txt(500, 80, '¥4980', 14, C.RED, 'center');
  rect(40, 30, 120, 80, C.NIGHT);
  outline(40, 30, 120, 80, '#2a2a30', 2);
}

function drawRentBg() {
  rect(0, 0, W, H, '#2a2826');
  rect(0, 0, W, 200, '#3a3632');
  rect(240, 40, 100, 180, '#4a4038');
  outline(240, 40, 100, 180, '#2a2420', 2);
  ctx.fillStyle = C.GOLD; ctx.beginPath(); ctx.arc(325, 140, 4, 0, Math.PI * 2); ctx.fill();
  rect(0, 200, W, H - 200, C.FLOOR);
  for (let i = 0; i < 8; i++) rect(0, 200 + i * 20, W, 1, '#221e1a');
  rect(40, 220, 140, 60, '#3a3448');
  rect(40, 210, 140, 14, '#4a4458');
  rect(440, 220, 120, 8, C.WOOD);
  rect(450, 228, 8, 50, C.WOOD); rect(542, 228, 8, 50, C.WOOD);
}

function drawNightBg() {
  rect(0, 0, W, H, C.NIGHT);
  // 星星闪烁
  for (let i = 0; i < 40; i++) {
    const x = (i * 137 + 17) % W, y = (i * 89 + 7) % 200;
    const tw = 0.35 + 0.65 * Math.abs(Math.sin(now * 1.3 + i * 0.7));
    ctx.globalAlpha = tw;
    rect(x, y, 1, 1, i % 3 ? '#e8e0c8' : '#6a7a8a');
  }
  ctx.globalAlpha = 1;
  // 月亮（带光晕）
  ctx.fillStyle = 'rgba(240,232,208,0.10)';
  ctx.beginPath(); ctx.arc(540, 60, 32, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f0e8d0'; ctx.beginPath(); ctx.arc(540, 60, 22, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.NIGHT; ctx.beginPath(); ctx.arc(550, 52, 20, 0, Math.PI * 2); ctx.fill();
  // 楼群剪影
  for (let i = 0; i < 10; i++) {
    const bx = i * 70, bw = 50 + (i * 13) % 30, bh = 60 + (i * 37) % 100;
    rect(bx, H - bh, bw, bh, '#12161e');
    for (let wy = H - bh + 10; wy < H - 10; wy += 14) {
      for (let wx = bx + 6; wx < bx + bw - 6; wx += 10) {
        if ((wx + wy) % 37 < 20) {
          const on = Math.sin(now * 0.9 + wx * 0.13 + wy * 0.07) > -0.2;
          if (on) rect(wx, wy, 3, 4, '#3a4a5a');
        }
      }
    }
  }
}

// ============================================================
// 剧本数据
// ============================================================
const LEVELS = [
  {
    id: 1, title: '第一关：老同学借钱', subtitle: '冒充熟人', start: 'n1',
    nodes: {
      n1: {
        stage: 'night', who: '林浩', avatar: '林', expr: 'normal',

// 状态
// ============================================================
let scene = 'title';
let currentLevel = 0;
let currentNode = null;
let currentMsgIndex = 0;
let choiceLock = false;
let msgTimer = 0;
let msgShownAt = [0];
let earnedStars = [];
let endStats = { safe: 0, danger: 0 };
let sceneT0 = 0;
let ptr = { x: 320, y: 180, down: false };
let choiceBoxes = [];

function go(s) { scene = s; sceneT0 = now; }

function startLevel(i) {
  currentLevel = i;
  currentNode = LEVELS[i].start;
  currentMsgIndex = 0;
  msgTimer = now;
  msgShownAt = [now];
  choiceLock = false;
  endStats = { safe: 0, danger: 0 };
  reviewScroll = 0;
  go('node');
}

function getNode() { return LEVELS[currentLevel].nodes[currentNode]; }

function chooseOption(idx) {
  if (choiceLock) return;
  const node = getNode();
  const opt = node.choices[idx];
  if (!opt) return;
  choiceLock = true;
  if (opt.kind === 'safe') endStats.safe++;
  if (opt.kind === 'danger') endStats.danger++;
  const target = LEVELS[currentLevel].nodes[opt.next];
  if (target.ending) {
    earnedStars[currentLevel] = target.ending;
    setTimeout(() => go('ending'), 300);
  } else {
    setTimeout(() => {
      currentNode = opt.next;
      currentMsgIndex = 0;
      msgTimer = now;
      msgShownAt = [now];
      choiceLock = false;
    }, 300);
  }
}

function drawTitle() {
  drawRoom();
  ctx.fillStyle = 'rgba(22,19,19,0.85)'; ctx.fillRect(0, 0, W, H);

  txt(W / 2, 40, '别 上 当', 44, C.RED_L, 'center');
  txt(W / 2, 100, '校园反诈情景游戏', 16, C.WHITE, 'center');
  txt(W / 2, 126, '五 个 场 景 · 五 次 抉 择 · 三 条 铁 律', 11, C.GREY, 'center');

  LEVELS.forEach((lv, i) => {
    const y = 160 + i * 24;
    const done = earnedStars[i];
    const mark = done === 'good' ? '✓' : done === 'bad' ? '✗' : '·';
    const col = done === 'good' ? C.GREEN_L : done === 'bad' ? C.RED_L : C.GREY_L;
    txt(80, y, mark, 14, col);
    txt(100, y + 1, lv.title, 13, done ? C.WHITE : C.GREY_L);
    txt(560, y + 1, lv.subtitle, 11, C.GREY, 'right');
  });

  const allDone = earnedStars.filter(Boolean).length === LEVELS.length;
  const label = allDone ? '查看终极复盘 ▶' : earnedStars.filter(Boolean).length ? '继续调查 ▶' : '开始调查 ▶';
  const bx = W / 2 - 90, by = 300;
  const hover = inBox(ptr.x, ptr.y, [bx, by, 180, 26]);
  rect(bx, by, 180, 26, hover ? C.RED : C.RED_D);
  outline(bx, by, 180, 26, C.RED_L);
  txt(W / 2, by + 7, label, 13, C.WHITE, 'center');
}

function titleClick(x, y) {
  const allDone = earnedStars.filter(Boolean).length === LEVELS.length;
  const bx = W / 2 - 90, by = 300;
  if (inBox(x, y, [bx, by, 180, 26])) {
    if (allDone) { go('final'); return; }
    const next = earnedStars.findIndex((v) => !v);
    startLevel(next >= 0 ? next : 0);
    return;
  }
  for (let i = 0; i < LEVELS.length; i++) {
    if (y >= 160 + i * 24 && y <= 160 + i * 24 + 18) { startLevel(i); return; }
  }
}

function drawNode() {
  const node = getNode();
  const level = LEVELS[currentLevel];

  // 上半部分：情景画面
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, 180); ctx.clip();
  drawScene(node.stage);

  // 对话对象（会说话、会呼吸）
  const lastAt = msgShownAt[currentMsgIndex] || 0;
  const npcTalking = (now - lastAt) < 1.6 || currentMsgIndex < node.msgs.length - 1;

  if (node.person) {
    drawPerson(node.person.x || 520, 180, 1, node.expr || 'normal', {
      seed: 1.7,
      female: node.person.female,
      phone: node.person.phone,
      folder: node.person.folder,
      talk: npcTalking,
    });
  }
  // 画"我"
  drawPerson(80, 180, 0.85, 'normal', {
    seed: 5.3,
    female: false,
    phone: node.stage === 'chat' || node.stage === 'group',
  });

  rect(0, 0, W, 22, 'rgba(22,19,19,0.75)');
  txt(12, 5, `${level.title}  ·  ${level.subtitle}`, 11, C.WHITE);
  txt(W - 12, 5, `第 ${currentLevel + 1} 关 / 5`, 11, C.GREY, 'right');
  ctx.restore();

  // 下半部分：聊天记录
  rect(0, 180, W, H - 180, C.CHAT_BG);
  rect(0, 180, W, 1, '#3a3632');

  rect(12, 188, 22, 22, C.RED_D);
  txt(23, 193, node.avatar || '?', 12, C.WHITE, 'center');
  txt(44, 186, node.who || '', 13, C.WHITE);
  txt(44, 202, '在线', 9, C.GREEN_L);

  // 消息
  let y = 216;
  const shown = node.msgs.slice(0, currentMsgIndex + 1);
  const rendered = [];
  for (const [who, text] of shown) {
    const isSys = who === 'sys' || who === 'nar';
    const size = 12;
    const maxW = isSys ? 540 : 400;
    const lines = wrap(text, size, maxW - 20);
    const h = lines.length * 16 + 10;
    rendered.push({ who, text, lines, h, isSys });
  }
  const totalH = rendered.reduce((s, r) => s + r.h + 6, 0);
  const viewTop = 214, viewBot = H - 110;
  if (totalH > viewBot - viewTop) y = viewBot - totalH;

  rendered.forEach((r, ri) => {
    // 入场动画
    const t0 = msgShownAt[ri] !== undefined ? msgShownAt[ri] : 0;
    const age = Math.max(0, now - t0);
    const k = Math.min(1, age / 0.22);
    const dy = (1 - k) * 10;
    ctx.globalAlpha = k;

    if (r.isSys) {
      for (const ln of r.lines) { txt(W / 2, y + 2 + dy, ln, 11, C.GREY, 'center'); y += 14; }
      y += 4;
    } else if (r.who === 'npc') {
      const bw = Math.max(...r.lines.map((l) => txtW(l, 12))) + 20;
      roundRect(44, y + dy, bw, r.h, 5, C.BUBBLE_OTHER);
      r.lines.forEach((ln, i) => txt(54, y + dy + 5 + i * 16, ln, 12, '#161313'));
      y += r.h + 6;
    } else {
      const bw = Math.max(...r.lines.map((l) => txtW(l, 12))) + 20;
      roundRect(W - 44 - bw, y + dy, bw, r.h, 5, C.BUBBLE_ME);
      r.lines.forEach((ln, i) => txt(W - 44 - bw + 10, y + dy + 5 + i * 16, ln, 12, '#161313'));
      y += r.h + 6;
    }
    ctx.globalAlpha = 1;
  });

  // 自动推进消息
  if (currentMsgIndex < node.msgs.length - 1 && now - msgTimer > 1.2) {
    currentMsgIndex++;
    msgTimer = now;
    msgShownAt[currentMsgIndex] = now;
  }

  if (currentMsgIndex >= node.msgs.length - 1 && !choiceLock) {
    drawChoices(node.choices);
  } else if (currentMsgIndex < node.msgs.length - 1) {
    // 正在输入动画
    const baseY = H - 30;
    txt(W / 2 - 14, baseY, '对方正在输入', 11, C.GREY, 'right');
    for (let i = 0; i < 3; i++) {
      const bounce = Math.sin(now * 6 - i * 0.8) * 1.6;
      ctx.fillStyle = C.GREY;
      ctx.beginPath();
      ctx.arc(W / 2 - 8 + i * 7, baseY + 6 + bounce, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawChoices(choices) {
  choiceBoxes = [];
  const n = choices.length;
  const totalH = n * 32 + (n - 1) * 6;
  const startY = H - 16 - totalH;
  choices.forEach((c, i) => {
    const y = startY + i * 38;
    const box = [40, y, W - 80, 30];
    choiceBoxes.push(box);
    const hover = inBox(ptr.x, ptr.y, box);
    rect(box[0], box[1], box[2], box[3], hover ? '#3a3632' : '#2a2622');
    outline(box[0], box[1], box[2], box[3], hover ? C.CLAUDE : '#4a4440');
    rect(box[0] + 6, box[1] + 7, 16, 16, hover ? C.RED : '#4a4440');
    txt(box[0] + 14, box[1] + 8, String.fromCharCode(65 + i), 11, C.WHITE, 'center');
    const lines = wrap(c.text, 12, box[2] - 50);
    lines.slice(0, 1).forEach((ln) => txt(box[0] + 30, box[1] + 6, ln, 12, C.WHITE));
  });
}

function nodeClick(x, y) {
  if (choiceLock) return;
  for (let i = 0; i < choiceBoxes.length; i++) {
    if (inBox(x, y, choiceBoxes[i])) { chooseOption(i); return; }
  }
}

    y += 22;
  };

  head('关键话术拆解');
  for (const [say, sig, fix] of rv.signals) {
    put(28, '「' + say + '」', 12, C.WHITE); y += 16;
    putW(36, '▸ 诈骗信号：' + sig, 11, C.ORANGE, W - 76);
    putW(36, '▸ 正确应对：' + fix, 11, C.GREEN_L, W - 76);
    y += 6;
  }

  head('法律提示');
  for (const [t, body, rel] of rv.laws) {
    put(28, t, 12, C.GOLD); y += 16;
    putW(36, body, 11, C.GREY_L, W - 76);
    putW(36, '与本局关系：' + rel, 11, C.CLAUDE_L, W - 76);
    y += 8;
  }

  head('自保口诀');
  rv.tips.forEach((t, i) => {
    putW(28, `${i + 1}. ${t}`, 12, C.WHITE, W - 70);
  });
  y += 12;

  return y - y0;
}

function drawReview() {
  const level = LEVELS[currentLevel];
  const rv = level.review;

  rect(0, 0, W, H, '#1e1b18');

  // 顶栏
  rect(0, 0, W, 34, C.RED_D);
  txt(16, 8, `${level.title} · 复盘`, 13, C.WHITE);

  const allDone = earnedStars.filter(Boolean).length === LEVELS.length;
  const btnLabel = allDone ? '终极复盘 ▶' : '返回选关 ▶';
  const btn = [W - 116, 6, 100, 22];
  const bHover = inBox(ptr.x, ptr.y, btn);
  rect(btn[0], btn[1], btn[2], btn[3], bHover ? C.RED : 'rgba(0,0,0,0.25)');
  outline(btn[0], btn[1], btn[2], btn[3], C.RED_L);
  txt(btn[0] + btn[2] / 2, btn[1] + 5, btnLabel, 11, C.WHITE, 'center');

  // 计算内容高度
  const totalH = layoutReview(rv, 0, false);
  const viewH = CONTENT_BOTTOM - CONTENT_TOP;
  reviewMaxScroll = Math.max(0, totalH - viewH + 8);
  if (reviewScroll > reviewMaxScroll) reviewScroll = reviewMaxScroll;
  if (reviewScroll < 0) reviewScroll = 0;

  // 内容区（裁剪 + 滚动）
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, CONTENT_TOP, W, viewH);
  ctx.clip();
  layoutReview(rv, CONTENT_TOP - reviewScroll, true);
  ctx.restore();

  // 滚动指示
  if (reviewScroll > 2) txt(W - 12, CONTENT_TOP + 2, '▲', 10, C.GREY, 'right');
  if (reviewScroll < reviewMaxScroll - 2) txt(W - 12, CONTENT_BOTTOM - 12, '▼', 10, C.GREY_D, 'right');

  // 底部讲解员面板
  rect(0, PANEL_TOP, W, H - PANEL_TOP, '#282320');
  rect(0, PANEL_TOP, W, 1, '#4a3a30');

  // 讲解小人
  const talkOn = (now % 4) < 2.6;
  drawPerson(50, H - 6, 0.92, 'normal', {
    seed: 9.1,
    glasses: true,
    shirt: '#5f4a3c',
    shirtL: '#71594a',
    pants: '#2e2823',
    talk: talkOn,
  });

  // 讲解气泡
  const bbx = 104, bby = PANEL_TOP + 14, bbw = W - bbx - 20, bbh = 62;
  roundRect(bbx, bby, bbw, bbh, 8, '#3a322c');
  outline(bbx, bby, bbw, bbh, '#5a4a3c');
  ctx.fillStyle = '#3a322c';
  ctx.beginPath();
  ctx.moveTo(bbx, bby + 20);
  ctx.lineTo(bbx - 12, bby + 30);
  ctx.lineTo(bbx, bby + 38);
  ctx.closePath(); ctx.fill();

  // 轮播口诀
  const idx = Math.floor(now / 3.2) % rv.tips.length;
  const tipLines = wrap('第 ' + (idx + 1) + ' 条：' + rv.tips[idx], 11, bbw - 24);
  tipLines.slice(0, 3).forEach((ln, i) => {
    txt(bbx + 12, bby + 10 + i * 15, ln, 11, C.CLAUDE_L);
  });
}

function reviewClick(x, y) {
  const btn = [W - 116, 6, 100, 22];
  if (inBox(x, y, btn)) {
    const allDone = earnedStars.filter(Boolean).length === LEVELS.length;
    reviewScroll = 0;
    if (allDone) go('final'); else go('title');
  }
}
function reviewWheel(dy) {
  reviewScroll = Math.max(0, Math.min(reviewMaxScroll, reviewScroll + dy * 0.6));
}

// ============================================================
// 渲染：终极复盘
// ============================================================
function drawFinal() {
  drawNightBg();
  ctx.fillStyle = 'rgba(22,19,19,0.85)'; ctx.fillRect(0, 0, W, H);
  rect(0, 0, W, 3, C.RED);
  txt(W / 2, 30, FINAL_REVIEW.title, 26, C.RED_L, 'center');
  let y = 74;
  for (const line of FINAL_REVIEW.text) {
    const lines = wrap(line, 12, W - 80);
    for (const ln of lines) { txt(W / 2, y, ln, 12, C.WHITE, 'center'); y += 18; }
    y += 4;
  }
  y += 10;
  FINAL_REVIEW.rules.forEach((r, i) => { txt(80, y, `${i + 1}. ${r}`, 12, C.CLAUDE_L); y += 20; });
  y += 8;
  txt(W / 2, y, `一个电话：${FINAL_REVIEW.hotline}`, 14, C.GOLD, 'center'); y += 20;
  txt(W / 2, y, FINAL_REVIEW.hotlineNote, 11, C.GREY, 'center'); y += 24;
  txt(W / 2, y, FINAL_REVIEW.last, 12, C.RED_L, 'center');

  const bx = W / 2 - 80, by = H - 30;
  const hover = inBox(ptr.x, ptr.y, [bx, by, 160, 24]);
  rect(bx, by, 160, 24, hover ? C.RED : C.RED_D);
  outline(bx, by, 160, 24, C.RED_L);
  txt(W / 2, by + 5, '重新开始', 13, C.WHITE, 'center');
}

function finalClick(x, y) {
  const bx = W / 2 - 80, by = H - 30;
  if (inBox(x, y, [bx, by, 160, 24])) {
    earnedStars = []; endStats = { safe: 0, danger: 0 }; reviewScroll = 0;
    go('title');
  }
}

// ============================================================
// 输入
// ============================================================
function toGame(ev) {
  const r = canvasEl.getBoundingClientRect();
  return [Math.floor((ev.clientX - r.left) * W / r.width), Math.floor((ev.clientY - r.top) * H / r.height)];
}

canvasEl.addEventListener('pointerdown', (ev) => {
  const [x, y] = toGame(ev);
  ptr.x = x; ptr.y = y; ptr.down = true;
  ev.preventDefault();

  if (scene === 'review') {
    const btn = [W - 116, 6, 100, 22];
    if (inBox(x, y, btn)) { reviewClick(x, y); return; }
    if (y > CONTENT_TOP && y < CONTENT_BOTTOM) {
      reviewDragging = true;
      reviewDragY = y;
      reviewDragStart = reviewScroll;
    }
    return;
  }

  if (scene === 'title') titleClick(x, y);
  else if (scene === 'node') nodeClick(x, y);
  else if (scene === 'ending') endingClick(x, y);
  else if (scene === 'final') finalClick(x, y);
});

canvasEl.addEventListener('pointermove', (ev) => {
  const [x, y] = toGame(ev);
  ptr.x = x; ptr.y = y;
  if (reviewDragging && scene === 'review') {
    reviewScroll = Math.max(0, Math.min(reviewMaxScroll, reviewDragStart - (y - reviewDragY)));
  }
});
canvasEl.addEventListener('pointerup', () => { ptr.down = false; reviewDragging = false; });
canvasEl.addEventListener('pointercancel', () => { ptr.down = false; reviewDragging = false; });
canvasEl.addEventListener('contextmenu', (e) => e.preventDefault());
canvasEl.addEventListener('wheel', (ev) => {
  if (scene === 'review') { reviewWheel(ev.deltaY); ev.preventDefault(); }
}, { passive: false });

// ============================================================
// 主循环
// ============================================================
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvasEl.style.width = Math.floor(W * s) + 'px';
  canvasEl.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fit);

function loop(ts) {
  now = ts / 1000;

  if (scene === 'title') drawTitle();
  else if (scene === 'node') drawNode();
  else if (scene === 'ending') drawEnding();
  else if (scene === 'review') drawReview();
  else if (scene === 'final') drawFinal();

  if (window.matchMedia('(pointer: fine)').matches) {
    canvasEl.style.cursor = 'none';
    const x = ptr.x, y = ptr.y;
    ctx.fillStyle = C.INK;
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x, y + 14); ctx.lineTo(x + 4, y + 10);
    ctx.lineTo(x + 7, y + 15); ctx.lineTo(x + 9, y + 14); ctx.lineTo(x + 6, y + 9);
    ctx.lineTo(x + 11, y + 9); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = C.WHITE; ctx.lineWidth = 1; ctx.stroke();
  }
  requestAnimationFrame(loop);
}

fit();
requestAnimationFrame(loop);
</script>
